global
    maxconn 256
    log stdout format raw local0
    stats socket ipv4@0.0.0.0:9999 level admin

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 1s

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend public_http
    bind :8080
    http-request del-header X-Forwarded-For
    default_backend defnett_servers

backend defnett_servers
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server server-a server-a:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr none
    server server-b server-b:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr none
