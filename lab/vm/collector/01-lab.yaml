# DEFNETT lab - collector (VM "Collector")
# enp0s8 = NIC1 NAT (MAC 08:00:27:61:2b:8a) - default route, DNS via DHCP
# enp0s9 = NIC2 host-only "defnett" (MAC 08:00:27:43:76:51) - static, NO routes
network:
  version: 2
  ethernets:
    enp0s8:
      dhcp4: true
      dhcp6: false
      accept-ra: false
    enp0s9:
      dhcp4: false
      dhcp6: false
      accept-ra: false
      addresses:
        - 192.168.56.20/24
