global
    maxconn 256
    log /dev/log local0
    user haproxy
    group haproxy
    stats socket ipv4@192.168.56.10:9999 level admin
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend public_http
    bind :8080
    http-request del-header X-Forwarded-For
    default_backend defnett_servers

backend defnett_servers
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server server-a 192.168.56.11:8080 check inter 2s fall 2 rise 2
    server server-b 192.168.56.12:8080 check inter 2s fall 2 rise 2
